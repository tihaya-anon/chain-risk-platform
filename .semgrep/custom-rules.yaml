# ============================================
# Custom Semgrep Rules - Chain Risk Platform
# ============================================
# Project-specific security patterns

rules:
  # ==================== Hardcoded Secrets ====================
  - id: crp-hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR := "..."
    metavariable-regex:
      metavariable: $VAR
      regex: '(?i)(password|secret|api_key|apikey|token|auth|credential)'
    message: "Potential hardcoded secret in variable '$VAR'. Use environment variables or Vault."
    severity: ERROR
    languages: [go, java, python, typescript, javascript]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: A07:2021

  # ==================== SQL Injection ====================
  - id: crp-sql-string-concat-go
    patterns:
      - pattern-either:
          - pattern: $DB.Raw($FMT + $INPUT, ...)
          - pattern: $DB.Exec($FMT + $INPUT, ...)
          - pattern: |
              fmt.Sprintf($QUERY, $INPUT)
              ...
              $DB.Raw($...)
    message: "SQL injection risk - use parameterized queries with GORM"
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: A03:2021

  - id: crp-sql-string-concat-java
    patterns:
      - pattern-either:
          - pattern: $STMT.executeQuery($QUERY + $INPUT)
          - pattern: |
              String $Q = "..." + $INPUT;
              ...
              $STMT.executeQuery($Q);
    message: "SQL injection risk - use PreparedStatement with parameters"
    severity: ERROR
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: A03:2021

  # ==================== Command Injection ====================
  - id: crp-command-injection-go
    patterns:
      - pattern-either:
          - pattern: exec.Command($CMD, $INPUT, ...)
          - pattern: exec.CommandContext($CTX, $CMD, $INPUT, ...)
    message: "Potential command injection - validate and sanitize input"
    severity: ERROR
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: A03:2021

  - id: crp-command-injection-python
    patterns:
      - pattern-either:
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: os.system($CMD)
    message: "Command injection risk - avoid shell=True, use list arguments"
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: A03:2021

  # ==================== Unsafe Deserialization ====================
  - id: crp-unsafe-deserialize-java
    patterns:
      - pattern-either:
          - pattern: new ObjectInputStream($INPUT)
          - pattern: (ObjectInputStream $OIS).readObject()
    message: "Unsafe deserialization - validate input source or use safe alternatives"
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021

  - id: crp-unsafe-deserialize-python
    patterns:
      - pattern-either:
          - pattern: pickle.load($INPUT)
          - pattern: pickle.loads($INPUT)
          - pattern: yaml.load($INPUT)
    message: "Unsafe deserialization - use yaml.safe_load() or json"
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: A08:2021

  # ==================== Path Traversal ====================
  - id: crp-path-traversal
    patterns:
      - pattern-either:
          - pattern: os.Open($PATH + $INPUT)
          - pattern: ioutil.ReadFile($PATH + $INPUT)
          - pattern: new File($PATH + $INPUT)
          - pattern: open($PATH + $INPUT, ...)
    message: "Path traversal risk - validate and sanitize file paths"
    severity: ERROR
    languages: [go, java, python]
    metadata:
      category: security
      cwe: "CWE-22: Path Traversal"
      owasp: A01:2021

  # ==================== Insecure Crypto ====================
  - id: crp-weak-crypto-go
    patterns:
      - pattern-either:
          - pattern: md5.New()
          - pattern: md5.Sum(...)
          - pattern: sha1.New()
          - pattern: sha1.Sum(...)
          - pattern: des.NewCipher(...)
    message: "Weak cryptographic algorithm - use SHA-256+ or AES"
    severity: WARNING
    languages: [go]
    metadata:
      category: security
      cwe: "CWE-327: Use of Broken Crypto Algorithm"
      owasp: A02:2021

  - id: crp-weak-crypto-java
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA1")
          - pattern: Cipher.getInstance("DES")
          - pattern: Cipher.getInstance("DES/...")
    message: "Weak cryptographic algorithm - use SHA-256+ or AES-256"
    severity: WARNING
    languages: [java]
    metadata:
      category: security
      cwe: "CWE-327: Use of Broken Crypto Algorithm"
      owasp: A02:2021

  # ==================== Blockchain Specific ====================
  - id: crp-unvalidated-address
    patterns:
      - pattern: |
          $ADDR = $INPUT
          ...
          $DB.Where("address = ?", $ADDR)
    pattern-not: |
      $ADDR = $INPUT
      ...
      validate($ADDR)
      ...
      $DB.Where("address = ?", $ADDR)
    message: "Blockchain address should be validated before database query"
    severity: WARNING
    languages: [go]
    metadata:
      category: security
      domain: blockchain

  - id: crp-risk-score-bounds
    patterns:
      - pattern: |
          $SCORE = $INPUT
          ...
          return $SCORE
    pattern-not: |
      $SCORE = $INPUT
      ...
      if $SCORE < 0 || $SCORE > 100 { ... }
      ...
      return $SCORE
    message: "Risk score should be validated within bounds (0-100)"
    severity: INFO
    languages: [go, python]
    metadata:
      category: business-logic
      domain: risk-scoring

  # ==================== Logging Sensitive Data ====================
  - id: crp-log-sensitive-data
    patterns:
      - pattern-either:
          - pattern: log.Printf($FMT, ..., $PASSWORD, ...)
          - pattern: logger.Info($MSG, ..., "password", $VAL, ...)
          - pattern: logger.info(f"... {$PASSWORD} ...")
    metavariable-regex:
      metavariable: $PASSWORD
      regex: '(?i)(password|secret|token|key|credential)'
    message: "Sensitive data should not be logged"
    severity: ERROR
    languages: [go, python]
    metadata:
      category: security
      cwe: "CWE-532: Information Exposure Through Log Files"
      owasp: A09:2021

  # ==================== Missing Error Handling ====================
  - id: crp-ignored-error-go
    pattern: $VAL, _ := $FUNC(...)
    message: "Error ignored - handle or explicitly document why"
    severity: WARNING
    languages: [go]
    metadata:
      category: reliability
      cwe: "CWE-754: Improper Check for Unusual Conditions"
