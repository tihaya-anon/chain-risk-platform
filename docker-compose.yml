services:
  # ============== Message Queue ==============
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "0.0.0.0:12181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "0.0.0.0:19092:19092"
      - "0.0.0.0:29093:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${DOCKER_HOST_IP:-localhost}:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  # ============== Databases ==============
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
    ports:
      - "0.0.0.0:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainrisk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  neo4j:
    image: neo4j:5.12-community
    container_name: neo4j
    environment:
      NEO4J_AUTH: neo4j/chainrisk123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "0.0.0.0:17474:7474"
      - "0.0.0.0:17687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "0.0.0.0:16379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend

  # ============== Security ==============
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "0.0.0.0:18200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - ./infra/vault/vault-config.hcl:/vault/config/vault.hcl:ro
    command: vault server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ============== Elasticsearch (Trace Storage) ==============
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - node.name=es-node-1
      - cluster.name=chainrisk-es
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "0.0.0.0:19200:9200"
      - "0.0.0.0:19300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ============== Monitoring ==============
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    ports:
      - "0.0.0.0:19090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - backend
      - monitoring

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "0.0.0.0:13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  # ============== Log Aggregation ==============
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    ports:
      - "0.0.0.0:13100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    volumes:
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring
      - backend

  # ============== Exporters (Monitoring) ==============
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
      - "--topic.filter=.*"
      - "--group.filter=.*"
    ports:
      - "0.0.0.0:19308:9308"
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - backend
      - monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://chainrisk:chainrisk123@postgres:5432/chainrisk?sslmode=disable"
    ports:
      - "0.0.0.0:19187:9187"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - backend
      - monitoring

  # ============== Service Discovery ==============
  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "0.0.0.0:18848:8848"
      - "0.0.0.0:19848:9848"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  # ============== Tracing (Jaeger with Elasticsearch) ==============
  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "0.0.0.0:26686:16686"    # Jaeger UI
      - "0.0.0.0:14268:14268"    # HTTP collector
      - "0.0.0.0:16831:6831/udp" # UDP agent
      - "0.0.0.0:14317:4317"     # OTLP gRPC
      - "0.0.0.0:14318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: elasticsearch
      ES_SERVER_URLS: http://elasticsearch:9200
      ES_INDEX_PREFIX: jaeger
      ES_TAGS_AS_FIELDS_ALL: "true"
      ES_NUM_SHARDS: 1
      ES_NUM_REPLICAS: 0
    restart: unless-stopped
    networks:
      - backend
      - monitoring

  # ============== Hudi Data Lake Infrastructure ==============
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "0.0.0.0:19000:9000"
      - "0.0.0.0:19001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/chainrisk-datalake --ignore-existing;
      mc mb myminio/chainrisk-warehouse --ignore-existing;
      exit 0;
      "
    networks:
      - backend

  hive-metastore:
    build:
      context: ./infra/hive
      dockerfile: Dockerfile
    container_name: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Xmx1G -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/chainrisk -Djavax.jdo.option.ConnectionUserName=chainrisk -Djavax.jdo.option.ConnectionPassword=chainrisk123"
      IS_RESUME: "true"
      SKIP_SCHEMA_INIT: "false"
    ports:
      - "0.0.0.0:19083:9083"
    volumes:
      - ./infra/hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - hive_metastore_data:/opt/hive/data
    restart: unless-stopped
    networks:
      - backend

  trino:
    image: trinodb/trino:435
    container_name: trino
    depends_on:
      - hive-metastore
      - minio
    ports:
      - "0.0.0.0:18081:8080"
    volumes:
      - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./infra/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./infra/trino/etc/log.properties:/etc/trino/log.properties:ro
      - ./infra/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend

  # ============== Application Services ==============
  query-service:
    build: ./services/query-service
    image: chainrisk/query-service:latest
    container_name: query-service
    profiles: ["services"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: query-service
    ports:
      - "0.0.0.0:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  alert-service:
    build: ./services/alert-service
    image: chainrisk/alert-service:latest
    container_name: alert-service
    profiles: ["services"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: alert-service
    ports:
      - "0.0.0.0:8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  risk-ml-service:
    build: ./services/risk-ml-service
    image: chainrisk/risk-ml-service:latest
    container_name: risk-ml-service
    profiles: ["services"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: risk-ml-service
    ports:
      - "0.0.0.0:8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend

  graph-service:
    build: ./services/graph-service
    image: chainrisk/graph-service:latest
    container_name: graph-service
    profiles: ["services"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: chainrisk123
      NACOS_SERVER_ADDR: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: graph-service
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "0.0.0.0:8084:8084"
    depends_on:
      - neo4j
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend

  orchestrator:
    build: ./services/orchestrator
    image: chainrisk/orchestrator:latest
    container_name: orchestrator
    profiles: ["services"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: orchestrator
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "0.0.0.0:8080:8080"
    depends_on:
      nacos:
        condition: service_healthy
      query-service:
        condition: service_healthy
      risk-ml-service:
        condition: service_healthy
      alert-service:
        condition: service_healthy
      graph-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - frontend
      - backend

  bff:
    build: ./services/bff
    image: chainrisk/bff:latest
    container_name: bff
    profiles: ["services"]
    environment:
      NODE_ENV: production
      ORCHESTRATOR_URL: http://orchestrator:8080
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: bff
    ports:
      - "0.0.0.0:3001:3001"
    depends_on:
      orchestrator:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - frontend
      - backend

volumes:
  zookeeper_data:
  kafka_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  prometheus_data:
  grafana_data:
  nacos_data:
  minio_data:
  hive_metastore_data:
  loki_data:
  elasticsearch_data:
  vault_data:

networks:
  frontend:
    name: chainrisk-frontend
    driver: bridge
  backend:
    name: chainrisk-backend
    driver: bridge
  monitoring:
    name: chainrisk-monitoring
    driver: bridge
