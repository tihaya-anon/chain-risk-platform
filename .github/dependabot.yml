version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/query-service
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go):"
    labels:
      - dependencies
      - go

  - package-ecosystem: gomod
    directory: /services/alert-service
