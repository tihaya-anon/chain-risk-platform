# ============================================
# Chain Risk Platform - CI Pipeline
# ============================================
# Monorepo CI: Build only changed services

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, develop/*]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Change Detection ====================
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      java: ${{ steps.filter.outputs.java }}
      python: ${{ steps.filter.outputs.python }}
      typescript: ${{ steps.filter.outputs.typescript }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            go:
              - 'data-ingestion/**'
              - 'services/query-service/**'
              - 'services/alert-service/**'
            java:
              - 'processing/**'
              - 'services/orchestrator/**'
              - 'services/graph-service/**'
            python:
              - 'services/risk-ml-service/**'
            typescript:
              - 'services/bff/**'
              - 'frontend/**'
            infra:
              - 'docker-compose.yml'
              - 'infra/**'

  # ==================== Lint All Services ====================
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - {name: query-service, path: services/query-service, lang: go}
          - {name: alert-service, path: services/alert-service, lang: go}
          - {name: data-ingestion, path: data-ingestion, lang: go}
          - {name: risk-ml-service, path: services/risk-ml-service, lang: python}
          - {name: graph-service, path: services/graph-service, lang: java}
          - {name: orchestrator, path: services/orchestrator, lang: java}
          - {name: processing, path: processing, lang: java}
          - {name: bff, path: services/bff, lang: node}
          - {name: frontend, path: frontend, lang: node}
    steps:
      - uses: actions/checkout@v4

      - name: Check service exists
        id: check
        run: |
          if [ -d "${{ matrix.service.path }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Lint Go
        if: matrix.service.lang == 'go' && steps.check.outputs.exists == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: ${{ matrix.service.path }}
          version: latest

      - name: Setup Python
        if: matrix.service.lang == 'python' && steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint Python
        if: matrix.service.lang == 'python' && steps.check.outputs.exists == 'true'
        run: |
          pip install ruff
          ruff check ${{ matrix.service.path }}

      - name: Setup Java
        if: matrix.service.lang == 'java' && steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Lint Java
        if: matrix.service.lang == 'java' && steps.check.outputs.exists == 'true'
        run: |
          cd ${{ matrix.service.path }}
          if [ -f "mvnw" ]; then
            ./mvnw checkstyle:check -q || true
          fi

      - name: Setup Node
        if: matrix.service.lang == 'node' && steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint Node
        if: matrix.service.lang == 'node' && steps.check.outputs.exists == 'true'
        run: |
          cd ${{ matrix.service.path }}
          if [ -f "package.json" ]; then
            npm ci
            npm run lint --if-present
          fi

  # ==================== Go Services ====================
  go:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - data-ingestion
          - services/query-service
          - services/alert-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Check service exists
        id: check
        run: |
          if [ -f "${{ matrix.service }}/go.mod" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: go build -v ./...

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: go test -v -race -coverprofile=coverage.out ./...

  # ==================== Java Services ====================
  java:
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - processing
          - services/orchestrator
          - services/graph-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check service exists
        id: check
        run: |
          if [ -f "${{ matrix.service }}/pom.xml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: mvn -B package -DskipTests

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: mvn test

  # ==================== Python Services ====================
  python:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/risk-ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check service exists
        id: check
        run: |
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi
        working-directory: services/risk-ml-service

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f pyproject.toml ]; then pip install -e .; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Test
        if: steps.check.outputs.exists == 'true'
        run: pytest --cov=app --cov-report=xml || true

  # ==================== TypeScript Services ====================
  typescript:
    needs: changes
    if: ${{ needs.changes.outputs.typescript == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - services/bff
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check service exists
        id: check
        run: |
          if [ -f "${{ matrix.service }}/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: npm run build --if-present

      - name: Test
        if: steps.check.outputs.exists == 'true'
        working-directory: ${{ matrix.service }}
        run: npm test --if-present

  # ==================== Docker Validation ====================
  docker:
    needs: changes
    if: ${{ needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config

  # ==================== Workflow Validation ====================
  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: |
          for f in .github/workflows/*.yml; do
            echo "Validating $f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
          done

  # ==================== CI Summary ====================
  ci-success:
    needs: [lint, go, java, python, typescript, docker, validate-workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ needs.lint.result }} ${{ needs.go.result }} ${{ needs.java.result }} ${{ needs.python.result }} ${{ needs.typescript.result }} ${{ needs.docker.result }} ${{ needs.validate-workflows.result }}"
          if echo "$results" | grep -q "failure"; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed or were skipped"
