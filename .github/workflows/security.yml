# ============================================
# Chain Risk Platform - Security Scanning
# ============================================
# SAST, dependency scanning, container scanning, secret detection

name: Security Scan

on:
  push:
    branches: [main, develop, develop/*]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6AM UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  # ==================== CodeQL SAST ====================
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, java, javascript, python]
        include:
          - language: go
            paths: services/query-service,services/alert-service,data-ingestion
          - language: java
            paths: services/orchestrator,services/graph-service,processing
          - language: javascript
            paths: services/bff,frontend
          - language: python
            paths: services/risk-ml-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Java
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # ==================== Semgrep SAST ====================
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/golang
            p/java
            p/python
            p/typescript
            .semgrep/custom-rules.yaml
          generateSarif: '1'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ==================== Dependency Scanning ====================
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan Go Services
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/query-service
          format: sarif
          output: trivy-go-query.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
        continue-on-error: true

      - name: Scan Go Alert Service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/alert-service
          format: sarif
          output: trivy-go-alert.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
        continue-on-error: true

      - name: Scan Python Service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/risk-ml-service
          format: sarif
          output: trivy-python.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
        continue-on-error: true

      - name: Scan Node BFF
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/bff
          format: sarif
          output: trivy-node.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
        continue-on-error: true

      - name: Scan Java Orchestrator
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/orchestrator
          format: sarif
          output: trivy-java-orch.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
        continue-on-error: true

      - name: Scan Java Graph Service
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: services/graph-service
          format: sarif
          output: trivy-java-graph.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
        continue-on-error: true

      - name: Upload Go Query SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-go-query.sarif
          category: trivy-go-query

      - name: Upload Go Alert SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-go-alert.sarif
          category: trivy-go-alert

      - name: Upload Python SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-python.sarif
          category: trivy-python

      - name: Upload Node SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-node.sarif
          category: trivy-node

      - name: Upload Java Orchestrator SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-java-orch.sarif
          category: trivy-java-orchestrator

      - name: Upload Java Graph SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-java-graph.sarif
          category: trivy-java-graph

  # ==================== Container Scanning ====================
  container-scan:
    name: Container Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [codeql]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - query-service
          - alert-service
          - risk-ml-service
          - bff
          - orchestrator
          - graph-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: chainrisk/${{ matrix.service }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: chainrisk/${{ matrix.service }}:scan
          format: sarif
          output: trivy-container-${{ matrix.service }}.sarif
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: '1'
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container-${{ matrix.service }}.sarif
          category: container-${{ matrix.service }}

  # ==================== Secret Detection ====================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ==================== License Compliance ====================
  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FOSSA Scan
        uses: fossas/fossa-action@main
        continue-on-error: true
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}

  # ==================== Security Gate ====================
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, dependency-scan, secret-scan]
    if: always()

    steps:
      - name: Check Results
        run: |
          echo "=== Security Scan Results ==="
          echo "CodeQL: ${{ needs.codeql.result }}"
          echo "Semgrep: ${{ needs.semgrep.result }}"
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          
          # Fail if critical checks failed
          if [[ "${{ needs.secret-scan.result }}" == "failure" ]]; then
            echo "❌ BLOCKED: Secret detection found issues"
            exit 1
          fi
          
          if [[ "${{ needs.codeql.result }}" == "failure" ]]; then
            echo "⚠️ WARNING: CodeQL found issues - review required"
          fi
          
          if [[ "${{ needs.semgrep.result }}" == "failure" ]]; then
            echo "⚠️ WARNING: Semgrep found issues - review required"
          fi
          
          echo "✅ Security gate passed"

  # ==================== Weekly Report ====================
  security-report:
    name: Weekly Security Report
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, dependency-scan, container-scan, secret-scan, license-scan]
    if: github.event_name == 'schedule'

    steps:
      - name: Generate Report
        run: |
          echo "# Weekly Security Report" > security-report.md
          echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> security-report.md
          echo "" >> security-report.md
          echo "## Scan Results" >> security-report.md
          echo "| Scan | Status |" >> security-report.md
          echo "|------|--------|" >> security-report.md
          echo "| CodeQL | ${{ needs.codeql.result }} |" >> security-report.md
          echo "| Semgrep | ${{ needs.semgrep.result }} |" >> security-report.md
          echo "| Dependencies | ${{ needs.dependency-scan.result }} |" >> security-report.md
          echo "| Containers | ${{ needs.container-scan.result }} |" >> security-report.md
          echo "| Secrets | ${{ needs.secret-scan.result }} |" >> security-report.md
          echo "| Licenses | ${{ needs.license-scan.result }} |" >> security-report.md
          cat security-report.md

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: security-report.md
          retention-days: 90
