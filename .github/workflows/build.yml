# ============================================
# Chain Risk Platform - Build Pipeline
# ============================================
# Build and push Docker images for changed services

name: Build

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'data-ingestion/**'
      - 'processing/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (leave empty for all changed)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ==================== Detect Changes ====================
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Manual service selection
        if: github.event.inputs.service != ''
        id: manual
        run: echo "changes=[\"${{ github.event.inputs.service }}\"]" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v2
        if: github.event.inputs.service == ''
        id: filter
        with:
          filters: |
            query-service: 'services/query-service/**'
            alert-service: 'services/alert-service/**'
            risk-ml-service: 'services/risk-ml-service/**'
            graph-service: 'services/graph-service/**'
            orchestrator: 'services/orchestrator/**'
            bff: 'services/bff/**'
            data-ingestion: 'data-ingestion/**'
            processing: 'processing/**'

  # ==================== Build Images ====================
  build:
    needs: changes
    if: ${{ needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine service path
        id: path
        run: |
          service="${{ matrix.service }}"
          if [[ "$service" == "data-ingestion" || "$service" == "processing" ]]; then
            echo "path=$service" >> $GITHUB_OUTPUT
          else
            echo "path=services/$service" >> $GITHUB_OUTPUT
          fi

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ steps.path.outputs.path }}/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found for ${{ matrix.service }}"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.path.outputs.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Generate SBOM
        if: steps.check.outputs.exists == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json

      - name: Upload SBOM
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json

  # ==================== Build Summary ====================
  build-summary:
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "| All changed services | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "| No changes detected | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
