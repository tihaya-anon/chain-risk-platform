server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs via Docker daemon
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep containers with a name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # Extract service name from container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.+)'
        target_label: service
      # Keep container ID
      - source_labels: ['__meta_docker_container_id']
        target_label: container_id
      # Network mode
      - source_labels: ['__meta_docker_network_name']
        target_label: network
    pipeline_stages:
      # Try to parse JSON logs
      - json:
          expressions:
            level: level
            msg: msg
            message: message
            time: time
            timestamp: timestamp
            trace_id: trace_id
            span_id: span_id
            service: service
      # Fallback: extract level from text logs
      - regex:
          expression: '(?P<level>DEBUG|INFO|WARN|WARNING|ERROR|FATAL|CRITICAL)'
      # Set labels from extracted values
      - labels:
          level:
          trace_id:
          span_id:
      # Timestamp parsing
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.000Z07:00"
            - "2006-01-02 15:04:05"
