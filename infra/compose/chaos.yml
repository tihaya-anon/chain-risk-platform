version: "3.8"

# Chaos Engineering Stack for fault injection testing
# Usage: docker compose -f infra/compose/chaos.yml up -d

services:
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.7.0
    container_name: toxiproxy
    ports:
      - "8474:8474"     # Toxiproxy API
      - "25432:25432"   # PostgreSQL proxy
      - "26379:26379"   # Redis proxy
      - "29092:29092"   # Kafka proxy
      - "27687:27687"   # Neo4j proxy
    volumes:
      - ../toxiproxy/config.json:/config/toxiproxy.json:ro
    command: ["-config", "/config/toxiproxy.json"]
    networks:
      - chainrisk-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8474/version"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  chainrisk-backend:
    external: true
