# Security: Vault with PKI Support
services:
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "0.0.0.0:18200:8200"
    environment:
      VAULT_ADDR: http://0.0.0.0:8200
      VAULT_API_ADDR: http://0.0.0.0:8200
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN:-chainrisk-dev-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ../vault/vault-config.hcl:/vault/config/vault.hcl:ro
      - ../vault/pki-config.hcl:/vault/config/pki-config.hcl:ro
      - ../vault/policies:/vault/policies:ro
    command: vault server -dev -dev-root-token-id=${VAULT_DEV_TOKEN:-chainrisk-dev-token}
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  # PKI initialization sidecar (runs once)
  vault-pki-init:
    image: hashicorp/vault:1.15
    container_name: vault-pki-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_TOKEN:-chainrisk-dev-token}
    volumes:
      - ../../scripts/certs:/scripts:ro
      - ../certs:/certs
      - ../vault/pki-config.hcl:/vault/config/pki-config.hcl:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Vault to be ready..."
        sleep 5
        
        # Check if PKI already initialized
        if vault secrets list 2>/dev/null | grep -q "^pki_int/"; then
          echo "PKI already initialized, skipping..."
          exit 0
        fi
        
        echo "Initializing PKI secrets engine..."
        
        # Enable PKI engines
        vault secrets enable pki || true
        vault secrets tune -max-lease-ttl=87600h pki
        
        vault secrets enable -path=pki_int pki || true
        vault secrets tune -max-lease-ttl=43800h pki_int
        
        # Generate Root CA
        vault write -format=json pki/root/generate/internal \
          common_name="Chain Risk Platform Root CA" \
          issuer_name="root-ca" \
          ttl=87600h \
          key_type=rsa \
          key_bits=4096
        
        vault write pki/config/urls \
          issuing_certificates="http://vault:8200/v1/pki/ca" \
          crl_distribution_points="http://vault:8200/v1/pki/crl"
        
        # Generate Intermediate CA
        vault write -format=json pki_int/intermediate/generate/internal \
          common_name="Chain Risk Platform Intermediate CA" \
          issuer_name="intermediate-ca" \
          key_type=rsa \
          key_bits=4096 > /tmp/int_csr.json
        
        CSR=$$(cat /tmp/int_csr.json | grep -o '"csr":"[^"]*"' | cut -d'"' -f4 | sed 's/\\n/\n/g')
        
        vault write -format=json pki/root/sign-intermediate \
          csr="$$CSR" \
          format=pem_bundle \
          ttl=43800h > /tmp/int_cert.json
        
        CERT=$$(cat /tmp/int_cert.json | grep -o '"certificate":"[^"]*"' | cut -d'"' -f4 | sed 's/\\n/\n/g')
        
        vault write pki_int/intermediate/set-signed certificate="$$CERT"
        
        vault write pki_int/config/urls \
          issuing_certificates="http://vault:8200/v1/pki_int/ca" \
          crl_distribution_points="http://vault:8200/v1/pki_int/crl"
        
        # Create service role
        vault write pki_int/roles/service-role \
          allowed_domains="chainrisk.local" \
          allow_subdomains=true \
          allow_localhost=true \
          allow_ip_sans=true \
          max_ttl=720h \
          ttl=720h \
          key_type=rsa \
          key_bits=2048 \
          require_cn=true \
          server_flag=true \
          client_flag=true
        
        # Apply PKI policy
        vault policy write pki-admin /vault/config/pki-config.hcl
        
        echo "PKI initialization complete!"
    networks:
      - backend

volumes:
  vault_data:
  vault_logs:
