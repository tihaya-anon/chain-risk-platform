# Standalone application services (no depends_on, use with existing infra)
services:
  query-service:
    image: chainrisk/query-service:latest
    container_name: query-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: query-service
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - chainrisk-backend

  alert-service:
    image: chainrisk/alert-service:latest
    container_name: alert-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:29092
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: alert-service
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - chainrisk-backend

  risk-ml-service:
    image: chainrisk/risk-ml-service:latest
    container_name: risk-ml-service
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: chainrisk
      POSTGRES_PASSWORD: chainrisk123
      POSTGRES_DB: chainrisk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: risk-ml-service
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - chainrisk-backend

  graph-service:
    image: chainrisk/graph-service:latest
    container_name: graph-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: chainrisk123
      NACOS_SERVER_ADDR: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: graph-service
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - chainrisk-backend

  orchestrator:
    image: chainrisk/orchestrator:latest
    container_name: orchestrator
    environment:
      SPRING_PROFILES_ACTIVE: docker
      NACOS_SERVER_ADDR: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: orchestrator
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - chainrisk-frontend
      - chainrisk-backend

  bff:
    image: chainrisk/bff:latest
    container_name: bff
    environment:
      NODE_ENV: production
      ORCHESTRATOR_URL: http://orchestrator:8080
      NACOS_SERVER: nacos:8848
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: bff
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - chainrisk-frontend
      - chainrisk-backend

networks:
  chainrisk-backend:
    external: true
  chainrisk-frontend:
    external: true
