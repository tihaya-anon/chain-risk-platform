# Data Lake: MinIO, Hive Metastore, Trino
services:
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "0.0.0.0:19000:9000"
      - "0.0.0.0:19001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      mc mb myminio/chainrisk-datalake --ignore-existing;
      mc mb myminio/chainrisk-warehouse --ignore-existing;
      exit 0;
      "
    networks:
      - backend

  hive-metastore:
    build:
      context: ../../infra/hive
      dockerfile: Dockerfile
    container_name: hive-metastore
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: "-Xmx1G -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/chainrisk -Djavax.jdo.option.ConnectionUserName=chainrisk -Djavax.jdo.option.ConnectionPassword=chainrisk123"
      IS_RESUME: "true"
      SKIP_SCHEMA_INIT: "false"
    ports:
      - "0.0.0.0:19083:9083"
    volumes:
      - ../../infra/hive/conf/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - hive_metastore_data:/opt/hive/data
    restart: unless-stopped
    networks:
      - backend

  trino:
    image: trinodb/trino:435
    container_name: trino
    depends_on:
      - hive-metastore
      - minio
    ports:
      - "0.0.0.0:18081:8080"
    volumes:
      - ../../infra/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ../../infra/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ../../infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ../../infra/trino/etc/log.properties:/etc/trino/log.properties:ro
      - ../../infra/trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - backend
