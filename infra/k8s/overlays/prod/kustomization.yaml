apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chain-risk-prod

resources:
  - ../../base

namePrefix: prod-

commonLabels:
  environment: prod

patches:
  # Production resource limits
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
    target:
      kind: Deployment
      name: risk-service
  # Production HPA settings
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 15
    target:
      kind: HorizontalPodAutoscaler
      name: query-service-hpa
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
    target:
      kind: HorizontalPodAutoscaler
      name: risk-service-hpa

configMapGenerator:
  - name: chain-risk-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
      - LOG_FORMAT=json

images:
  - name: chain-risk/query-service
    newTag: v1.0.0
  - name: chain-risk/risk-service
    newTag: v1.0.0
  - name: chain-risk/alert-service
    newTag: v1.0.0
  - name: chain-risk/graph-service
    newTag: v1.0.0
  - name: chain-risk/bff
    newTag: v1.0.0
  - name: chain-risk/orchestrator
    newTag: v1.0.0
  - name: chain-risk/stream-processor
    newTag: v1.0.0
