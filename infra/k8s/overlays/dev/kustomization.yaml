apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: chain-risk-dev

resources:
  - ../../base

namePrefix: dev-

commonLabels:
  environment: dev

# Dev-specific patches
patches:
  # Reduce replicas for dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
  # Disable HPA in dev
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler

configMapGenerator:
  - name: chain-risk-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - LOG_FORMAT=text

images:
  - name: chain-risk/query-service
    newTag: dev
  - name: chain-risk/risk-service
    newTag: dev
  - name: chain-risk/alert-service
    newTag: dev
  - name: chain-risk/graph-service
    newTag: dev
  - name: chain-risk/bff
    newTag: dev
  - name: chain-risk/orchestrator
    newTag: dev
  - name: chain-risk/stream-processor
    newTag: dev
