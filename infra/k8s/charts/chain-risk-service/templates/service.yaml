apiVersion: v1
kind: Service
metadata:
  name: {{ include "chain-risk-service.fullname" . }}
  labels:
    {{- include "chain-risk-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "chain-risk-service.selectorLabels" . | nindent 4 }}
