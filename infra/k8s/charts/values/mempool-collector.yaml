# Mempool Collector values
nameOverride: mempool-collector
fullnameOverride: mempool-collector

image:
  repository: chain-risk/mempool-collector
  tag: "0.18.0"

replicaCount: 1  # Only one collector per Ethereum node

service:
  port: 9090
  metricsPort: 9091

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false  # Single instance per node

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

env:
  - name: ETHEREUM_WS_URL
    value: "ws://geth:8546"
  - name: KAFKA_BROKERS
    value: "kafka:9092"
