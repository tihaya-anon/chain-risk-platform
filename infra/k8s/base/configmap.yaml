apiVersion: v1
kind: ConfigMap
metadata:
  name: chain-risk-config
  namespace: chain-risk
data:
  # Kafka
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC_RAW_BLOCKS: "raw-blocks"
  KAFKA_TOPIC_RAW_TXS: "raw-transactions"
  KAFKA_TOPIC_ENRICHED: "enriched-transactions"
  KAFKA_TOPIC_ALERTS: "alerts"
  KAFKA_CONSUMER_GROUP: "chain-risk-group"

  # PostgreSQL
  PG_HOST: "postgres"
  PG_PORT: "5432"
  PG_DATABASE: "chain_risk"

  # Neo4j
  NEO4J_URI: "bolt://neo4j:7687"

  # Redis
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # Services
  QUERY_SERVICE_URL: "http://query-service:8081"
  RISK_SERVICE_URL: "http://risk-service:8082"
  ALERT_SERVICE_URL: "http://alert-service:8083"
  GRAPH_SERVICE_URL: "http://graph-service:8084"
  BFF_SERVICE_URL: "http://bff:3001"

  # Observability
  JAEGER_ENDPOINT: "http://jaeger:14268/api/traces"
  PROMETHEUS_ENDPOINT: "http://prometheus:9090"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
