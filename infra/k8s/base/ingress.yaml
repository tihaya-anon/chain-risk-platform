apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chain-risk-ingress
  namespace: chain-risk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: chain-risk.local
      http:
        paths:
          # BFF - Main API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 3001
          # GraphQL endpoint
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 3001
          # WebSocket for real-time alerts
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 3001
---
# Internal services ingress (for debugging/admin)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chain-risk-internal-ingress
  namespace: chain-risk
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: chain-risk-internal.local
      http:
        paths:
          - path: /query(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: query-service
                port:
                  number: 8081
          - path: /risk(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: risk-service
                port:
                  number: 8082
          - path: /alert(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: alert-service
                port:
                  number: 8083
          - path: /graph(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: graph-service
                port:
                  number: 8084
