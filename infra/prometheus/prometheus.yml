global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Infrastructure Services
  # Kafka
  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "kafka"

  # PostgreSQL
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "postgres"

  # MinIO
  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "minio"

  # Trino
  - job_name: "trino"
    static_configs:
      - targets: ["trino:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "trino"

  # Application Services
  - job_name: "query-service"
    static_configs:
      - targets: ["query-service:8081"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "query-service"

  - job_name: "risk-ml-service"
    static_configs:
      - targets: ["risk-ml-service:8082"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "risk-ml-service"

  - job_name: "alert-service"
    static_configs:
      - targets: ["alert-service:8083"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "alert-service"

  - job_name: "graph-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["graph-service:8084"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "graph-service"
