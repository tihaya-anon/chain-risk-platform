global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: chain-risk-dev

# Rule files for alerting
rule_files:
  # - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ============== Infrastructure Services ==============

  # Kafka Exporter
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: kafka

  # PostgreSQL Exporter
  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: postgres

  # Neo4j Metrics (native Prometheus endpoint)
  - job_name: neo4j
    metrics_path: /metrics
    static_configs:
      - targets: ["neo4j:2004"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: neo4j

  # MinIO
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: minio

  # Trino
  - job_name: trino
    metrics_path: /v1/jmx/mbean
    static_configs:
      - targets: ["trino:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: trino

  # ============== Application Services (Docker containers) ==============
  # Services run as Docker containers, accessed via Docker service names

  # Query Service (Go) - Port 8081
  - job_name: query-service
    static_configs:
      - targets: ["query-service:8081"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: query-service

  # Risk ML Service (Python) - Port 8082
  - job_name: risk-ml-service
    static_configs:
      - targets: ["risk-ml-service:8082"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: risk-ml-service

  # Alert Service (Go) - Port 8083
  - job_name: alert-service
    static_configs:
      - targets: ["alert-service:8083"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: alert-service

  # Graph Service (Java Spring) - Port 8084
  - job_name: graph-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["graph-service:8084"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: graph-service

  # Orchestrator (Java Spring) - Port 8080
  - job_name: orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["orchestrator:8080"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: orchestrator

  # BFF Service (NestJS) - Port 3001
  - job_name: bff
    static_configs:
      - targets: ["bff:3001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: bff

  # ============== Processing Services ==============

  # Flink Stream Processor - JobManager metrics
  - job_name: flink-jobmanager
    static_configs:
      - targets: ["flink-jobmanager:9249"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: flink-jobmanager
