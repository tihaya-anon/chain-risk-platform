# OpenTelemetry Collector Configuration
# Dual export: Real-time backends + Kafka for data lake archival

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 10s
          static_configs:
            - targets: [localhost:8888]

processors:
  batch:
    send_batch_size: 1000
    timeout: 10s

  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: deployment.environment
        value: ${OTEL_ENV:-dev}
        action: upsert
      - key: service.namespace
        value: chain-risk
        action: upsert

  attributes/kafka:
    actions:
      - key: kafka.partition
        action: delete

exporters:
  # Real-time: Jaeger for traces
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Real-time: Prometheus for metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Real-time: Loki for logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      attributes:
        service.name: service_name
        severity: severity
      resource:
        service.namespace: namespace

  # Data Lake: Kafka for metrics
  kafka/metrics:
    brokers:
      - kafka:9092
    topic: otel-metrics
    encoding: otlp_json
    producer:
      compression: snappy
      max_message_bytes: 1048576

  # Data Lake: Kafka for logs
  kafka/logs:
    brokers:
      - kafka:9092
    topic: otel-logs
    encoding: otlp_json
    producer:
      compression: snappy
      max_message_bytes: 1048576

  # Data Lake: Kafka for traces
  kafka/traces:
    brokers:
      - kafka:9092
    topic: otel-traces
    encoding: otlp_json
    producer:
      compression: snappy
      max_message_bytes: 1048576

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  zpages:
    endpoint: 0.0.0.0:55679

service:
  extensions: [health_check, zpages]
  
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [otlp/jaeger, kafka/traces]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, kafka/metrics]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [loki, kafka/logs]

  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
