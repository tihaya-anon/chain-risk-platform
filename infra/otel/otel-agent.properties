# OpenTelemetry Java Agent Configuration
#
# Usage: java -javaagent:opentelemetry-javaagent.jar \
#              -Dotel.javaagent.configuration-file=otel-agent.properties \
#              -jar app.jar

# Service identification (override per service)
otel.service.name=${OTEL_SERVICE_NAME:-unknown-service}
otel.resource.attributes=service.namespace=chain-risk,deployment.environment=${OTEL_ENV:-dev}

# OTLP Exporter (Jaeger)
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
otel.exporter.otlp.protocol=grpc

# Traces
otel.traces.exporter=otlp
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=1.0

# Metrics (disabled - using Micrometer/Prometheus)
otel.metrics.exporter=none

# Logs (disabled - using Logback)
otel.logs.exporter=none

# Instrumentation
otel.instrumentation.common.default-enabled=true
otel.instrumentation.jdbc.enabled=true
otel.instrumentation.kafka.enabled=true
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.spring-webmvc.enabled=true

# Propagation
otel.propagators=tracecontext,baggage

# Span limits
otel.span.attribute.value.length.limit=4096
otel.span.attribute.count.limit=128
otel.span.event.count.limit=128
otel.span.link.count.limit=128
