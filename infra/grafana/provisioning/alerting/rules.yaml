apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: infra-service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "docs/sre/runbooks/SERVICE_DOWN.md"
        labels:
          severity: critical
          team: platform

      - uid: infra-kafka-lag-high
        title: Kafka Consumer Lag High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(kafka_consumergroup_lag) by (consumergroup) > 10000
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kafka consumer lag is high for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} has lag > 10000 messages."
          runbook_url: "docs/sre/runbooks/KAFKA_LAG.md"
        labels:
          severity: warning
          team: platform

      - uid: infra-postgres-high-latency
        title: PostgreSQL High Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(pg_stat_statements_seconds_bucket[5m])) by (le)) > 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PostgreSQL query latency is high"
          description: "Database P95 query latency exceeds 1 second."
          runbook_url: "docs/sre/runbooks/DATABASE_FAILURE.md"
        labels:
          severity: warning
          team: platform

      - uid: infra-postgres-connections-high
        title: PostgreSQL Connections High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_stat_activity_count{datname="chainrisk"} > 80
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Database chainrisk has more than 80 connections."
          runbook_url: "docs/sre/runbooks/DATABASE_FAILURE.md"
        labels:
          severity: warning
          team: platform

  - orgId: 1
    name: SLO Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: slo-error-budget-burn-critical
        title: Error Budget Burning Fast (Critical)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (1 - (sum(rate(http_requests_total{service="query-service",status!~"5.."}[1h])) 
                / sum(rate(http_requests_total{service="query-service"}[1h])))) / 0.005 > 14.4
                or
                (1 - (sum(rate(http_requests_total{service="alert-service",status!~"5.."}[1h])) 
                / sum(rate(http_requests_total{service="alert-service"}[1h])))) / 0.001 > 14.4
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Error budget burning 14x faster than allowed"
          description: "Service error budget will be exhausted before end of period at current rate."
          runbook_url: "docs/sre/runbooks/HIGH_ERROR_RATE.md"
        labels:
          severity: critical
          team: platform

      - uid: slo-error-budget-burn-warning
        title: Error Budget Burning (Warning)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (1 - (sum(rate(http_requests_total{service=~"query-service|risk-ml-service|alert-service"}[1h])) 
                / sum(rate(http_requests_total{service=~"query-service|risk-ml-service|alert-service"}[1h])))) > 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Error budget burn rate elevated"
          description: "Services consuming error budget faster than sustainable."
          runbook_url: "docs/sre/runbooks/HIGH_ERROR_RATE.md"
        labels:
          severity: warning
          team: platform

      - uid: slo-availability-breach
        title: SLO Availability Breach
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (sum(rate(http_requests_total{service="query-service",status!~"5.."}[5m])) 
                / sum(rate(http_requests_total{service="query-service"}[5m]))) < 0.985
                or
                (sum(rate(http_requests_total{service="alert-service",status!~"5.."}[5m])) 
                / sum(rate(http_requests_total{service="alert-service"}[5m]))) < 0.989
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Service availability below SLO threshold"
          description: "Availability dropped below SLO - 1% margin."
          runbook_url: "docs/sre/runbooks/SERVICE_DOWN.md"
        labels:
          severity: critical
          team: platform

      - uid: slo-latency-breach
        title: SLO Latency Breach
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{service="query-service"}[5m])) by (le)) > 1
                or
                histogram_quantile(0.95, sum(rate(ml_inference_duration_seconds_bucket{service="risk-ml-service"}[5m])) by (le)) > 0.4
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Service latency exceeds SLO threshold"
          description: "P99/P95 latency is 2x the SLO target."
          runbook_url: "docs/sre/runbooks/HIGH_LATENCY.md"
        labels:
          severity: critical
          team: platform

  - orgId: 1
    name: Service Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: svc-error-rate-high
        title: High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
                / sum(rate(http_requests_total[5m])) by (service) > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High error rate detected on {{ $labels.service }}"
          description: "Error rate exceeds 5% for 5 minutes."
          runbook_url: "docs/sre/runbooks/HIGH_ERROR_RATE.md"
        labels:
          severity: warning
          team: platform

      - uid: svc-latency-high
        title: High Latency (P99 > 2s)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, service)) > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Service {{ $labels.service }} P99 latency > 2s"
          description: "High latency detected - P99 > 2s for 5 minutes."
          runbook_url: "docs/sre/runbooks/HIGH_LATENCY.md"
        labels:
          severity: warning
          team: platform

  - orgId: 1
    name: ML/GNN Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: ml-model-not-loaded
        title: ML Model Not Loaded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: ml_model_loaded{service="risk-ml-service"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "ML model {{ $labels.model_type }} not loaded"
          description: "Model has been NOT LOADED for over 2 minutes."
          runbook_url: "docs/sre/runbooks/ML_MODEL_FAILURE.md"
        labels:
          severity: critical
          team: ml

      - uid: ml-inference-latency-high
        title: ML Inference Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(ml_inference_duration_seconds_bucket[5m])) by (le)) > 0.5
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "ML inference latency is high"
          description: "Ensemble model P95 latency above 500ms for 5 minutes."
          runbook_url: "docs/sre/runbooks/ML_MODEL_FAILURE.md"
        labels:
          severity: warning
          team: ml

  - orgId: 1
    name: Circuit Breaker Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: cb-state-open
        title: Circuit Breaker Open
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: circuit_breaker_state == 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Circuit breaker {{ $labels.name }} is OPEN"
          description: "Service {{ $labels.service }} circuit breaker opened due to failures."
          runbook_url: "docs/sre/runbooks/DATABASE_FAILURE.md"
        labels:
          severity: warning
          team: platform
