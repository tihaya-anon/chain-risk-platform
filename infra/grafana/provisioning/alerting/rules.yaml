apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: infra-service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 1 minute."
          runbook_url: "https://confluence.example.com/runbooks/service-down"
        labels:
          severity: critical
          team: platform

      - uid: infra-kafka-lag-high
        title: Kafka Consumer Lag High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(kafka_consumergroup_lag) by (consumergroup) > 10000
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kafka consumer lag is high for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} has lag > 10000 messages."
        labels:
          severity: warning
          team: platform

      - uid: infra-postgres-connections-high
        title: PostgreSQL Connections High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_stat_activity_count{datname="chainrisk"} > 80
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Database chainrisk has more than 80 connections."
        labels:
          severity: warning
          team: platform

      - uid: infra-loki-down
        title: Loki Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="loki"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Loki log aggregation is down"
          description: "Log aggregation service is unavailable, logs may be lost."
        labels:
          severity: critical
          team: platform

  - orgId: 1
    name: Service Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: svc-error-rate-high
        title: High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  sum by (job) (rate(query_service_http_requests_total{status=~"5.."}[5m]))
                  + sum by (job) (rate(risk_ml_service_http_requests_total{status=~"5.."}[5m]))
                  + sum by (job) (rate(alert_service_http_requests_total{status=~"5.."}[5m]))
                ) / (
                  sum by (job) (rate(query_service_http_requests_total[5m]))
                  + sum by (job) (rate(risk_ml_service_http_requests_total[5m]))
                  + sum by (job) (rate(alert_service_http_requests_total[5m]))
                ) > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High error rate detected (>5%)"
          description: "Error rate across services exceeds 5% for 5 minutes."
        labels:
          severity: warning
          team: platform

      - uid: svc-latency-high
        title: High Latency (P99 > 2s)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.99, 
                  sum(rate(query_service_http_request_duration_seconds_bucket[5m])) by (le)
                  + sum(rate(risk_ml_service_http_request_duration_seconds_bucket[5m])) by (le)
                  + sum(rate(alert_service_http_request_duration_seconds_bucket[5m])) by (le)
                ) > 2
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Service P99 latency exceeds 2 seconds"
          description: "High latency detected - P99 > 2s for 5 minutes."
        labels:
          severity: warning
          team: platform

      - uid: svc-query-service-degraded
        title: Query Service Degraded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(query_service_http_request_duration_seconds_bucket[5m])) by (le)) > 1
                or
                sum(rate(query_service_http_requests_total{status=~"5.."}[5m])) / sum(rate(query_service_http_requests_total[5m])) > 0.02
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Query Service performance degraded"
          description: "Query service P95 > 1s or error rate > 2%."
        labels:
          severity: warning
          team: platform

  - orgId: 1
    name: ML/GNN Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: ml-model-not-loaded
        title: ML Model Not Loaded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: risk_ml_service_model_loaded == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "ML model {{ $labels.model_type }} not loaded"
          description: "The {{ $labels.model_type }} model has been in NOT LOADED state for over 2 minutes."
        labels:
          severity: critical
          team: ml

      - uid: ml-inference-latency-high
        title: ML Inference Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(risk_ml_service_risk_score_latency_seconds_bucket{model_type="ensemble"}[5m])) by (le)) > 0.5
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "ML inference latency is high"
          description: "Ensemble model P95 latency is above 500ms for over 5 minutes."
        labels:
          severity: warning
          team: ml

      - uid: ml-inference-errors
        title: ML Inference Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(risk_ml_service_model_inference_errors_total[5m])) > 10
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "ML inference errors detected"
          description: "More than 10 inference errors in the last 5 minutes."
        labels:
          severity: warning
          team: ml

      - uid: ml-high-risk-score-spike
        title: High Risk Score Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(increase(risk_ml_service_risk_score_value_bucket{le="1.0"}[5m])) 
                - sum(increase(risk_ml_service_risk_score_value_bucket{le="0.8"}[5m])) > 100
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Spike in high-risk scores detected"
          description: "More than 100 addresses scored >0.8 risk in last 5 minutes."
        labels:
          severity: warning
          team: security

  - orgId: 1
    name: Alert Service Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: alert-notification-failures
        title: Alert Notification Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(alert_service_notifications_sent_total{status="failed"}[5m])) 
                / sum(rate(alert_service_notifications_sent_total[5m])) > 0.1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High notification failure rate"
          description: "More than 10% of alert notifications are failing."
        labels:
          severity: warning
          team: platform

      - uid: alert-critical-spike
        title: Critical Alert Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(alert_service_alerts_triggered_total{severity="critical"}[5m])) > 50
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Spike in critical alerts"
          description: "More than 50 critical alerts triggered in the last 5 minutes."
        labels:
          severity: critical
          team: security

  - orgId: 1
    name: Observability Stack Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: obs-jaeger-down
        title: Jaeger Tracing Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="jaeger"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Jaeger tracing is down"
          description: "Distributed tracing is unavailable, traces will be lost."
        labels:
          severity: warning
          team: platform

      - uid: obs-prometheus-target-down
        title: Prometheus Target Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job=~".*service.*"} == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Metrics scraping failed for {{ $labels.job }}."
        labels:
          severity: warning
          team: platform
