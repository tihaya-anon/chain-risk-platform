apiVersion: 1

groups:
  - orgId: 1
    name: Infrastructure Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: infra-service-down
        title: Service Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "The service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes."
        labels:
          severity: critical
          team: platform

      - uid: infra-kafka-lag-high
        title: Kafka Consumer Lag High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(kafka_consumergroup_lag) by (consumergroup) > 10000
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Kafka consumer lag is high for {{ $labels.consumergroup }}"
          description: "Consumer group {{ $labels.consumergroup }} has lag > 10000 messages."
        labels:
          severity: warning
          team: platform

      - uid: infra-postgres-connections-high
        title: PostgreSQL Connections High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_stat_activity_count{datname="chainrisk"} > 80
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "PostgreSQL connection count is high"
          description: "Database chainrisk has more than 80 connections."
        labels:
          severity: warning
          team: platform

  - orgId: 1
    name: Service Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: svc-error-rate-high
        title: Service Error Rate High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (
                  sum(rate(query_service_http_requests_total{status=~"5.."}[5m])) by (job)
                  / sum(rate(query_service_http_requests_total[5m])) by (job)
                ) > 0.05
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "Service {{ $labels.job }} has error rate > 5% for the last 5 minutes."
        labels:
          severity: warning
          team: platform

      - uid: svc-latency-high
        title: Service Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(query_service_http_request_duration_seconds_bucket[5m])) by (le)) > 1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High latency detected"
          description: "Query service P95 latency is above 1 second."
        labels:
          severity: warning
          team: platform

  - orgId: 1
    name: ML/GNN Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: ml-model-not-loaded
        title: ML Model Not Loaded
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: risk_ml_service_model_loaded == 0
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "ML model {{ $labels.model_type }} not loaded"
          description: "The {{ $labels.model_type }} model has been in NOT LOADED state for over 2 minutes."
        labels:
          severity: critical
          team: ml

      - uid: ml-inference-latency-high
        title: ML Inference Latency High
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum(rate(risk_ml_service_risk_score_latency_seconds_bucket{model_type="ensemble"}[5m])) by (le)) > 0.5
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "ML inference latency is high"
          description: "Ensemble model P95 latency is above 500ms for over 5 minutes."
        labels:
          severity: warning
          team: ml

      - uid: ml-inference-errors
        title: ML Inference Errors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(risk_ml_service_model_inference_errors_total[5m])) > 10
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "ML inference errors detected"
          description: "More than 10 inference errors in the last 5 minutes."
        labels:
          severity: warning
          team: ml

  - orgId: 1
    name: Alert Service Alerts
    folder: Chain Risk Platform
    interval: 1m
    rules:
      - uid: alert-notification-failures
        title: Alert Notification Failures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(alert_service_notifications_sent_total{status="failed"}[5m])) 
                / sum(rate(alert_service_notifications_sent_total[5m])) > 0.1
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "High notification failure rate"
          description: "More than 10% of alert notifications are failing."
        labels:
          severity: warning
          team: platform

      - uid: alert-critical-spike
        title: Critical Alert Spike
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(alert_service_alerts_triggered_total{severity="critical"}[5m])) > 50
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: count
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Spike in critical alerts"
          description: "More than 50 critical alerts triggered in the last 5 minutes."
        labels:
          severity: critical
          team: security
