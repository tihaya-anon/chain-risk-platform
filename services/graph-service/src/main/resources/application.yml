server:
  port: 8084

spring:
  application:
    name: graph-service

  # Import Nacos configuration
  config:
    import: optional:nacos:chain-risk-pipeline.yaml

  # Neo4j Configuration
  neo4j:
    uri: bolt://${NEO4J_HOST:localhost}:${NEO4J_PORT:17687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:chainrisk123}

  # MVC Configuration
  mvc:
    static-path-pattern: /**
  web:
    resources:
      add-mappings: true

# Graph Service Configuration (defaults, can be overridden by Nacos)
graph:
  # Network (ethereum, bsc, etc.)
  network: ${GRAPH_NETWORK:ethereum}

  clustering:
    # Minimum cluster size to persist
    min-cluster-size: ${pipeline.clustering.minClusterSize:2}
    # Maximum depth for common input analysis
    max-depth: ${pipeline.clustering.maxDepth:3}

  propagation:
    # Maximum hops for tag propagation
    max-hops: ${pipeline.propagation.maxHops:5}
    # Decay factor per hop (0.0 - 1.0)
    decay-factor: ${pipeline.propagation.decayFactor:0.7}
    # Minimum score threshold to continue propagation
    min-threshold: ${pipeline.propagation.minThreshold:0.1}

# Actuator & Prometheus Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: graph-service
    export:
      prometheus:
        enabled: true

# Logging
logging:
  level:
    root: INFO
    com.chainrisk.graph: DEBUG
    org.neo4j: INFO
    org.springframework.data.neo4j: INFO
    com.alibaba.nacos: INFO

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
