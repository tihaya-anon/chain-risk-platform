# TLS/mTLS Configuration Profile
# Activated via: spring.profiles.active=tls

server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:/certs/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: orchestrator
    # mTLS: require client certificate
    client-auth: need
    trust-store: ${SSL_TRUSTSTORE_PATH:/certs/truststore.p12}
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD:changeit}
    trust-store-type: PKCS12
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

# Update service URLs to use HTTPS
services:
  bff:
    url: ${BFF_URL:https://bff:3443}

spring:
  cloud:
    gateway:
      httpclient:
        ssl:
          use-insecure-trust-manager: false
          trusted-x509-certificates:
            - /certs/ca.pem
          key-store: ${SSL_KEYSTORE_PATH:/certs/keystore.p12}
          key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
          key-store-type: PKCS12

# Logging for TLS debugging
logging:
  level:
    javax.net.ssl: INFO
    sun.security.ssl: INFO
