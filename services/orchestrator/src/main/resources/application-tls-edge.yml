# TLS Configuration Profile for Edge Gateway
# Activated via: spring.profiles.active=tls-edge
#
# Orchestrator is the edge gateway facing external clients.
# - TLS enabled for encryption
# - mTLS disabled (external clients don't have certificates)
# - Uses mTLS as CLIENT when calling internal services (BFF)

server:
  port: 8443
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH:/certs/keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: orchestrator
    # Edge gateway: NO client certificate required from external clients
    client-auth: none
    protocol: TLS
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers:
      - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256

# Update service URLs to use HTTPS
services:
  bff:
    url: ${BFF_URL:https://bff:3443}

spring:
  cloud:
    gateway:
      httpclient:
        ssl:
          # mTLS as CLIENT when calling BFF (internal service)
          use-insecure-trust-manager: false
          trusted-x509-certificates:
            - /certs/ca.pem
          key-store: ${SSL_KEYSTORE_PATH:/certs/keystore.p12}
          key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
          key-store-type: PKCS12

logging:
  level:
    javax.net.ssl: INFO
    sun.security.ssl: INFO
