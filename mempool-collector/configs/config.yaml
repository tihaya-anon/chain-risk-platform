server:
  port: 9090
  read_timeout: 10s
  write_timeout: 10s

ethereum:
  ws_url: ws://localhost:8546
  network: ethereum
  reconnect_interval: 5s
  max_reconnect_delay: 60s
  subscription_buffer: 10000

kafka:
  brokers: localhost:19092
  topic: mempool-pending-txs
  batch_size: 1000
  linger_ms: 10
  compression_type: lz4
  flush_timeout: 5s

nacos:
  enabled: false
  server_addr: localhost:8848
  namespace_id: ""
  service_name: mempool-collector

metrics:
  enabled: true
  port: 9091
