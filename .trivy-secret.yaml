# ============================================
# Trivy Secret Scanning Configuration
# ============================================

rules:
  - id: aws-access-key
    category: AWS
    title: AWS Access Key ID
    regex: '(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'
    severity: CRITICAL

  - id: private-key
    category: AsymmetricPrivateKey
    title: Private Key
    regex: '-----BEGIN (?:RSA|EC|DSA|OPENSSH) PRIVATE KEY-----'
    severity: CRITICAL

  - id: jwt-token
    category: JWT
    title: JWT Token
    regex: 'eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'
    severity: HIGH

allow-rules:
  - id: example-files
    description: Allow secrets in example/test files
    path: '.*\.(example|sample|test).*'

  - id: documentation
    description: Allow patterns in documentation
    path: '.*\.(md|rst|txt)$'
